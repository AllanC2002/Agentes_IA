<!DOCTYPE html><html lang='es'><head><link rel='stylesheet' href='style.css'></head><body><h1>Mi App</h1><button id='btn'>Obtener Saludo</button><div id='resultado'></div><script>document.getElementById('btn').addEventListener('click', () => {fetch('/api/saludo').then(r => r.json()).then(data => document.getElementById('resultado').innerText = data.mensaje)})</script></body></html>
