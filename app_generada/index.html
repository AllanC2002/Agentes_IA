<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Mi App</title><link rel='stylesheet' href='style.css'></head><body><h1>Mi App</h1><button id='btn'>Obtener Saludo</button><div id='resultado'></div><script>document.getElementById('btn').addEventListener('click', () => {fetch('/api/saludo').then(r => r.json()).then(data => document.getElementById('resultado').innerText = data.mensaje)})</script></body></html>
