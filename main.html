<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App Generaator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <header>
            <div class="badge">CrewAI · Groq · FastAPI</div>
            <h1>AI App<br><span>Generator</span></h1>
            <p class="subtitle">Describe tu app y la IA la construye por ti</p>
        </header>

        <section id="estado-input">
            <textarea id="descripcion" placeholder="Ej: una app de lista de tareas..." rows="4"></textarea>
            <button id="btn-generar" onclick="generar()">Generar App <span>→</span></button>
        </section>

        <section id="estado-generando" style="display:none">
            <div class="spinner-wrap">
                <div class="spinner"></div>
                <span id="status-text">Iniciando agentes...</span>
            </div>
            <p class="aviso">⏳ Esto puede tomar varios minutos.</p>
        </section>

        <section id="estado-listo" style="display:none">
            <div class="resultado-header">
                <span class="check">✓</span>
                <h2>App generada</h2>
            </div>
            <div class="cmd-block">
                <span class="cmd-label">Para ejecutarla:</span>
                <code>cd app_generada && python main.py</code>
            </div>
            <div class="feedback-wrap">
                <p class="feedback-label">¿Qué tal quedó?</p>
                <div class="feedback-btns">
                    <button class="btn-secondary btn-ok" onclick="feedback('ok')">👍 Perfecta</button>
                    <button class="btn-secondary btn-warn" onclick="feedback('mejorar')">⚠️ Mejorar algo</button>
                    <button class="btn-secondary" onclick="feedback('regenerar')">🔄 Regenerar todo</button>
                </div>
            </div>
            <div id="mejora-wrap" style="display:none">
                <textarea id="mejora-texto" placeholder="¿Qué específicamente falló o falta?..." rows="3"></textarea>
                <button onclick="enviarMejora()">Aplicar mejora →</button>
            </div>
        </section>
    </main>

    <script>
        // ─── Ruta relativa: funciona en localhost y en cualquier deploy ───
        const API = 'http://127.0.0.1:8000'

        let source = null
        let descripcionActual = ''
        let timeoutHandle = null
        const TIMEOUT_MS = 10 * 60 * 1000  // 10 minutos

        // ─── Genera un UUID v4 simple para identificar cada sesión ───
        function uuidv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16)
            })
        }

        function mostrarEstado(estado) {
            document.getElementById('estado-input').style.display     = estado === 'input'     ? 'block' : 'none'
            document.getElementById('estado-generando').style.display = estado === 'generando' ? 'block' : 'none'
            document.getElementById('estado-listo').style.display     = estado === 'listo'     ? 'block' : 'none'
        }

        function setStatus(msg) {
            document.getElementById('status-text').textContent = msg
        }

        function limpiarTimeout() {
            if (timeoutHandle) {
                clearTimeout(timeoutHandle)
                timeoutHandle = null
            }
        }

        function cerrarSSE() {
            if (source) {
                source.close()
                source = null
            }
            limpiarTimeout()
        }

        async function generar() {
            descripcionActual = document.getElementById('descripcion').value.trim()
            if (!descripcionActual) return
            await lanzarCrew(descripcionActual)
        }

        async function lanzarCrew(descripcion) {
            mostrarEstado('generando')
            setStatus('Preparando sesión...')

            // Cierra cualquier SSE anterior para evitar listeners huérfanos
            cerrarSSE()

            // UUID único por ejecución — el servidor aísla los eventos por sesión
            const sesionId = uuidv4()

            // ── 1. Abre el SSE ANTES del POST para no perder el evento "inicio" ──
            setStatus('Abriendo canal de progreso...')
            source = new EventSource(`${API}/progreso/${sesionId}`)

            // Desactiva reconexión automática del browser:
            // si el servidor cierra la conexión intencionalmente, no queremos
            // que EventSource vuelva a conectar y cree una sesión fantasma.
            source.addEventListener('error', () => {
                // Solo cerramos; el handler onerror ya muestra el mensaje.
                source.close()
            })

            source.onmessage = (e) => {
                const data = JSON.parse(e.data)

                if (data.tipo === 'ping') return  // heartbeat silencioso

                setStatus(data.mensaje)

                if (data.tipo === 'finalizado') {
                    cerrarSSE()
                    mostrarEstado('listo')           // ← aquí aparece la ventana de feedback
                    return
                }

                if (data.tipo === 'error') {
                    cerrarSSE()
                    setStatus(`❌ ${data.mensaje}`)
                    // Vuelve al input después de 4 segundos para que el usuario pueda reintentar
                    setTimeout(() => mostrarEstado('input'), 4000)
                    return
                }
            }

            source.onerror = () => {
                // Solo dispara si el SSE se cae inesperadamente (no por cierre intencional)
                if (source && source.readyState === EventSource.CLOSED) return
                cerrarSSE()
                setStatus('❌ Se perdió la conexión con el servidor.')
                setTimeout(() => mostrarEstado('input'), 4000)
            }

            // ── 2. Timeout de seguridad: si en 10 min no llega "finalizado" ──
            timeoutHandle = setTimeout(() => {
                cerrarSSE()
                setStatus('⏱ Tiempo máximo superado. Intenta de nuevo.')
                setTimeout(() => mostrarEstado('input'), 4000)
            }, TIMEOUT_MS)

            // ── 3. Espera breve para que el SSE esté abierto antes del POST ──
            await new Promise(r => setTimeout(r, 600))

            setStatus('Enviando descripción a los agentes...')

            try {
                const res = await fetch(`${API}/generar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ descripcion, sesion_id: sesionId })
                })
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`)
                }
            } catch (err) {
                cerrarSSE()
                setStatus(`❌ No se pudo contactar el servidor: ${err.message}`)
                setTimeout(() => mostrarEstado('input'), 4000)
            }
        }

        function feedback(tipo) {
            if (tipo === 'ok') {
                fetch(`${API}/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: 'ok', descripcion: descripcionActual })
                })
                document.getElementById('descripcion').value = ''
                mostrarEstado('input')
            } else if (tipo === 'mejorar') {
                document.getElementById('mejora-wrap').style.display = 'block'
                document.getElementById('mejora-texto').focus()
            } else if (tipo === 'regenerar') {
                lanzarCrew(descripcionActual)
            }
        }

        async function enviarMejora() {
            const mejora = document.getElementById('mejora-texto').value.trim()
            if (!mejora) return
            descripcionActual = `${descripcionActual}. MEJORA SOLICITADA: ${mejora}`
            await lanzarCrew(descripcionActual)
        }
    </script>
</body>
</html>
