<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <header>
            <div class="badge">CrewAI · Groq · FastAPI</div>
            <h1>AI App<br><span>Generator</span></h1>
            <p class="subtitle">Describe tu app y la IA la construye por ti</p>
        </header>

        <!-- PANTALLA PRINCIPAL SIEMPRE VISIBLE -->
        <section id="estado-input">
            <textarea id="descripcion" placeholder="Ej: Crea una app de tareas... O si ya generaste una, escribe tu mejora (Ej: pon el fondo azul)" rows="4"></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-generar" onclick="generar()">Generar App Nueva <span>🚀</span></button>
                <button id="btn-mejorar" class="btn-secondary" style="background-color: #4a4a6a; color: white;" onclick="aplicarSugerencia()">Aplicar Sugerencia a la App <span>🔄</span></button>
            </div>
            
            <p id="mensaje-exito" style="color: #4CAF50; display: none; margin-top: 10px; font-weight: bold;">
                ✅ ¡App generada con éxito! Revisa la carpeta app_generada/
            </p>
        </section>

        <!-- PANTALLA DE CARGA -->
        <section id="estado-generando" style="display:none">
            <div class="spinner-wrap">
                <div class="spinner"></div>
                <span id="status-text">Iniciando agentes...</span>
            </div>
            <p class="aviso">⏳ Esto puede tomar varios minutos. No cierres la ventana.</p>
        </section>
    </main>

    <script>
        const API = 'http://127.0.0.1:8000'
        let source = null
        let appOriginal = '' // Guarda el contexto de la app actual

        function mostrarEstado(estado) {
            document.getElementById('estado-input').style.display = estado === 'input' ? 'block' : 'none'
            document.getElementById('estado-generando').style.display = estado === 'generando' ? 'block' : 'none'
        }

        function setStatus(msg) {
            document.getElementById('status-text').textContent = msg
        }

        function cerrarSSE() {
            if (source) {
                source.close()
                source = null
            }
        }

        // --- FLUJO 1: APP NUEVA ---
        async function generar() {
            const texto = document.getElementById('descripcion').value.trim()
            if (!texto) return
            
            appOriginal = texto; // Guardamos la idea base
            document.getElementById('mensaje-exito').style.display = 'none';
            await lanzarCrew(texto)
        }

        // --- FLUJO 2: MEJORA SOBRE LA APP ANTERIOR ---
        async function aplicarSugerencia() {
            const mejora = document.getElementById('descripcion').value.trim()
            if (!mejora) return

            document.getElementById('mensaje-exito').style.display = 'none';

            // 1. Guardamos la sugerencia directo en memory.md en el backend
            try {
                await fetch(`${API}/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: 'mejora', descripcion: mejora })
                });
            } catch (err) {
                console.error("No se pudo guardar la mejora en el backend", err);
            }

            // 2. Construimos el nuevo prompt combinando la idea original y la mejora
            const nuevoPrompt = `App original solicitada: ${appOriginal || 'Desconocida'}. MEJORA SOLICITADA AHORA: ${mejora}. Por favor lee context.md y memory.md para ver el progreso anterior y aplica esta mejora.`;
            
            // 3. Volvemos a generar
            await lanzarCrew(nuevoPrompt)
        }

        // --- LOGICA DEL CREW (Simplificada) ---
        async function lanzarCrew(descripcion) {
            mostrarEstado('generando')
            setStatus('Preparando sesión...')
            cerrarSSE()

            // UUID simple 
            const sesionId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2);

            source = new EventSource(`${API}/progreso/${sesionId}`)

            source.onmessage = (e) => {
                const data = JSON.parse(e.data)
                if (data.tipo === 'ping') return 

                // Si es un pensamiento de agente, lo mostramos
                if (data.tipo === 'agente') {
                    setStatus(data.mensaje)
                    return
                }

                setStatus(data.mensaje)

                if (data.tipo === 'finalizado') {
                    cerrarSSE()
                    mostrarEstado('input') 
                    // Mostramos el mensaje de éxito y limpiamos el input para la siguiente mejora
                    document.getElementById('mensaje-exito').style.display = 'block'
                    document.getElementById('descripcion').value = ''
                    return
                }

                if (data.tipo === 'error') {
                    cerrarSSE()
                    setStatus(`❌ ${data.mensaje}`)
                    setTimeout(() => mostrarEstado('input'), 4000)
                }
            }

            source.onerror = () => {
                cerrarSSE()
                setStatus('❌ Error de conexión. Revisa la consola del servidor.')
                setTimeout(() => mostrarEstado('input'), 4000)
            }

            try {
                await fetch(`${API}/generar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ descripcion, sesion_id: sesionId })
                })
            } catch (err) {
                cerrarSSE()
                setStatus(`❌ Error al enviar: ${err.message}`)
                setTimeout(() => mostrarEstado('input'), 4000)
            }
        }
    </script>
</body>
</html>
